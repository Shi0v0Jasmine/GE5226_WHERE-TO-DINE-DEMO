<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where to DINE | NYC Dining Intelligence</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --ink: #182321;
      --muted: #65716e;
      --line: #dfe5e2;
      --panel: #ffffff;
      --soft: #f4f7f5;
      --teal: #187d70;
      --teal-dark: #105e55;
      --coral: #dc6a4b;
      --amber: #d29b32;
      --shadow: 0 8px 24px rgba(20, 37, 33, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--soft);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }

    button, select, input { font: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid rgba(24, 125, 112, 0.22);
      outline-offset: 1px;
    }

    .app-shell {
      height: 100%;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .topbar {
      min-height: 64px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      z-index: 1001;
    }

    .brand { min-width: 220px; }
    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 760;
    }
    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .stats {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat {
      min-width: 96px;
      padding: 6px 10px;
      border-left: 1px solid var(--line);
    }
    .stat span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
    }
    .stat strong { font-size: 16px; }

    .controls {
      min-height: 66px;
      padding: 8px 18px;
      display: grid;
      grid-template-columns: repeat(5, minmax(118px, 1fr)) 150px 44px;
      gap: 8px;
      align-items: end;
      background: #f9fbfa;
      border-bottom: 1px solid var(--line);
      z-index: 1000;
    }

    .field label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .field select, .field input {
      width: 100%;
      height: 34px;
      border: 1px solid #cfd8d4;
      border-radius: 6px;
      color: var(--ink);
      background: white;
      padding: 0 9px;
    }

    .icon-button {
      width: 40px;
      height: 34px;
      border: 1px solid #cfd8d4;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: var(--teal-dark);
      background: white;
      cursor: pointer;
    }
    .icon-button:hover { background: #edf5f2; }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
    }
    #map { width: 100%; height: 100%; }

    .sidebar {
      min-width: 0;
      overflow-y: auto;
      background: var(--panel);
      border-left: 1px solid var(--line);
    }

    .sidebar-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px 16px;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .sidebar-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .sidebar-title h2 {
      margin: 0;
      font-size: 15px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 190px;
      color: var(--muted);
      font-size: 11px;
      overflow-wrap: anywhere;
    }
    .status.estimated { color: #9b6113; }
    .query-location {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .results {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .empty {
      padding: 48px 24px;
      color: var(--muted);
      text-align: center;
    }
    .empty svg { margin-bottom: 10px; color: var(--teal); }

    .result-card {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      cursor: pointer;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }
    .result-card:hover {
      border-color: #9bc5bb;
      box-shadow: var(--shadow);
    }

    .result-top {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
    }
    .rank {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: var(--teal);
      font-size: 12px;
      font-weight: 750;
    }
    .result-name {
      min-width: 0;
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .result-meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }
    .score {
      color: var(--teal-dark);
      font-size: 20px;
      font-weight: 780;
    }

    .metrics {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .metric {
      padding: 7px;
      border-radius: 6px;
      background: var(--soft);
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
    }
    .metric strong { font-size: 12px; }

    .breakdown { margin-top: 10px; }
    .bar-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) 30px;
      gap: 6px;
      align-items: center;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
    }
    .bar-track {
      height: 5px;
      border-radius: 3px;
      overflow: hidden;
      background: #e6ebe8;
    }
    .bar-fill { height: 100%; background: var(--teal); }
    .bar-row:nth-child(2) .bar-fill { background: var(--coral); }
    .bar-row:nth-child(3) .bar-fill { background: var(--amber); }

    .leaflet-popup-content { margin: 10px 12px; }
    .map-popup strong { display: block; margin-bottom: 4px; }
    .map-popup span { color: var(--muted); font-size: 11px; }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .app-shell { min-height: 100%; height: auto; }
      .topbar { align-items: flex-start; }
      .stats { display: none; }
      .controls {
        grid-template-columns: repeat(3, minmax(110px, 1fr));
      }
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(440px, 58vh) auto;
      }
      .sidebar {
        max-height: none;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }

    @media (max-width: 600px) {
      .topbar { min-height: 56px; padding: 9px 12px; }
      .brand h1 { font-size: 17px; }
      .controls {
        padding: 8px 10px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .icon-button { width: 100%; }
      .workspace { grid-template-rows: 52vh auto; }
      .metrics { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>Where to DINE</h1>
        <p>NYC dining district intelligence</p>
      </div>
      <div class="stats">
        <div class="stat"><span>Districts</span><strong id="stat-hotspots">--</strong></div>
        <div class="stat"><span>Restaurants</span><strong id="stat-restaurants">--</strong></div>
        <div class="stat"><span>Taxi arrivals</span><strong id="stat-taxi">--</strong></div>
      </div>
    </header>

    <section class="controls" aria-label="Recommendation controls">
      <div class="field">
        <label for="profile">Profile</label>
        <select id="profile">
          <option value="balanced">Balanced</option>
          <option value="quality_seeker">Quality seeker</option>
          <option value="convenience">Convenience</option>
          <option value="local_gem">Local gem</option>
          <option value="late_night">Late night</option>
        </select>
      </div>
      <div class="field">
        <label for="time-profile">Time</label>
        <select id="time-profile">
          <option value="any">Any time</option>
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
          <option value="late_night">Late night</option>
        </select>
      </div>
      <div class="field">
        <label for="mode">Travel mode</label>
        <select id="mode">
          <option value="walk">Walk</option>
          <option value="bike">Bike</option>
          <option value="drive">Drive</option>
        </select>
      </div>
      <div class="field">
        <label for="backend">Routing</label>
        <select id="backend">
          <option value="osmnx">OSM network</option>
          <option value="proxy">Estimate</option>
        </select>
      </div>
      <div class="field">
        <label for="score-version">Scoring</label>
        <select id="score-version">
          <option value="v3">Product v3</option>
          <option value="v2">Entropy v2</option>
          <option value="v1">Legacy v1</option>
        </select>
      </div>
      <div class="field">
        <label for="max-time">Max minutes</label>
        <input id="max-time" type="number" min="5" max="180" value="30">
      </div>
      <button class="icon-button" id="reset-map" title="Reset map" aria-label="Reset map">
        <i data-lucide="locate-fixed" width="17" height="17"></i>
      </button>
    </section>

    <section class="workspace">
      <div id="map" aria-label="NYC dining hotspot map"></div>
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="sidebar-title">
            <h2>Recommendations</h2>
            <span class="status" id="backend-status">
              <i data-lucide="route" width="13" height="13"></i>
              Select a map location
            </span>
          </div>
          <div class="query-location" id="query-location">NYC</div>
        </div>
        <div class="results" id="results">
          <div class="empty">
            <i data-lucide="map-pin" width="28" height="28"></i>
            <div>Select a point on the map</div>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const NYC_CENTER = [40.7128, -74.0060];
    const map = L.map("map", { zoomControl: true }).setView(NYC_CENTER, 11);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap &copy; CARTO",
      maxZoom: 19
    }).addTo(map);

    let hotspotsLayer = L.geoJSON(null).addTo(map);
    let selectedMarker = null;
    let highlighted = null;
    let lastLocation = null;

    const number = new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 });
    const results = document.getElementById("results");
    const statusEl = document.getElementById("backend-status");

    function colorForScore(score) {
      if (score >= 70) return "#187d70";
      if (score >= 40) return "#d29b32";
      return "#dc6a4b";
    }

    async function loadStats() {
      const response = await fetch("/api/stats");
      if (!response.ok) return;
      const stats = await response.json();
      document.getElementById("stat-hotspots").textContent = number.format(stats.total_hotspots);
      document.getElementById("stat-restaurants").textContent = number.format(stats.total_restaurants);
      document.getElementById("stat-taxi").textContent = number.format(stats.total_taxi_dropoffs);
    }

    async function loadHotspots() {
      const response = await fetch("/api/hotspots");
      if (!response.ok) return;
      const geojson = await response.json();
      hotspotsLayer.clearLayers();
      hotspotsLayer = L.geoJSON(geojson, {
        style: feature => {
          const p = feature.properties;
          const score = p.area_quality_score_v3 ?? p.popularity_score_v2 ?? p.popularity_score ?? 0;
          return { color: colorForScore(score), weight: 1.5, fillOpacity: 0.18 };
        },
        onEachFeature: (feature, layer) => {
          const p = feature.properties;
          const score = p.area_quality_score_v3 ?? p.popularity_score_v2 ?? p.popularity_score ?? 0;
          layer.bindPopup(`<div class="map-popup"><strong>Dining district</strong><span>Quality ${score.toFixed(1)} · ${p.n_restaurants || 0} restaurants</span></div>`);
        }
      }).addTo(map);
    }

    function controls() {
      return {
        profile: document.getElementById("profile").value,
        time_profile: document.getElementById("time-profile").value,
        mode: document.getElementById("mode").value,
        backend: document.getElementById("backend").value,
        score_version: document.getElementById("score-version").value,
        max_time_min: document.getElementById("max-time").value
      };
    }

    function renderBar(label, value) {
      const safe = Math.max(0, Math.min(100, Number(value || 0)));
      return `<div class="bar-row"><span>${label}</span><div class="bar-track"><div class="bar-fill" style="width:${safe}%"></div></div><strong>${safe.toFixed(0)}</strong></div>`;
    }

    function renderResults(data) {
      const items = data.recommendations || [];
      statusEl.classList.toggle("estimated", data.effective_backend === "proxy");
      statusEl.innerHTML = `<i data-lucide="${data.effective_backend === "proxy" ? "triangle-alert" : "route"}" width="13" height="13"></i>${data.effective_backend}${data.fallback_reason ? " · estimated" : ""}`;
      if (!items.length) {
        results.innerHTML = `<div class="empty"><i data-lucide="circle-off" width="28" height="28"></i><div>${data.message || "No reachable districts"}</div></div>`;
        lucide.createIcons();
        return;
      }
      results.innerHTML = items.map(item => {
        const components = item.score_components || {};
        const bars = Object.entries(components)
          .filter(([name]) => name !== "access")
          .slice(0, 3)
          .map(([name, value]) => renderBar(name, value))
          .join("");
        return `<article class="result-card" data-lat="${item.centroid_lat}" data-lon="${item.centroid_lon}" data-geometry='${JSON.stringify(item.geometry)}'>
          <div class="result-top">
            <div class="rank">${item.rank}</div>
            <div>
              <h3 class="result-name">Dining district ${item.rank}</h3>
              <div class="result-meta">${item.n_restaurants} restaurants · confidence ${item.data_confidence.toFixed(0)}</div>
            </div>
            <div class="score">${item.recommendation_score.toFixed(1)}</div>
          </div>
          <div class="metrics">
            <div class="metric"><span>Travel</span><strong>${item.travel_time_min.toFixed(0)} min</strong></div>
            <div class="metric"><span>Area</span><strong>${item.area_quality_score.toFixed(0)}</strong></div>
            <div class="metric"><span>Access</span><strong>${item.accessibility_score.toFixed(0)}</strong></div>
          </div>
          <div class="breakdown">${bars}</div>
        </article>`;
      }).join("");
      document.querySelectorAll(".result-card").forEach(card => {
        card.addEventListener("click", () => {
          const geometry = JSON.parse(card.dataset.geometry);
          if (highlighted) map.removeLayer(highlighted);
          highlighted = L.geoJSON(geometry, {
            style: { color: "#182321", weight: 3, fillOpacity: 0.08 }
          }).addTo(map);
          map.flyTo([Number(card.dataset.lat), Number(card.dataset.lon)], 14);
        });
      });
      lucide.createIcons();
    }

    async function requestRecommendations(lat, lon) {
      lastLocation = [lat, lon];
      const params = new URLSearchParams({ ...controls(), allow_fallback: "true", limit: "10" });
      results.innerHTML = `<div class="empty"><i data-lucide="loader-circle" width="28" height="28"></i><div>Calculating routes</div></div>`;
      lucide.createIcons();
      try {
        const response = await fetch(`/api/recommend?${params}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lat, lon })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        document.getElementById("query-location").textContent = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
        renderResults(data);
      } catch (error) {
        results.innerHTML = `<div class="empty"><i data-lucide="triangle-alert" width="28" height="28"></i><div>${error.message}</div></div>`;
        lucide.createIcons();
      }
    }

    map.on("click", event => {
      if (selectedMarker) map.removeLayer(selectedMarker);
      selectedMarker = L.circleMarker(event.latlng, {
        radius: 7, color: "#182321", weight: 2, fillColor: "#ffffff", fillOpacity: 1
      }).addTo(map);
      requestRecommendations(event.latlng.lat, event.latlng.lng);
    });

    document.querySelectorAll(".controls select, .controls input").forEach(control => {
      control.addEventListener("change", () => {
        if (lastLocation) requestRecommendations(...lastLocation);
      });
    });
    document.getElementById("reset-map").addEventListener("click", () => map.setView(NYC_CENTER, 11));
    loadStats();
    loadHotspots();
    lucide.createIcons();
  </script>
</body>
</html>
