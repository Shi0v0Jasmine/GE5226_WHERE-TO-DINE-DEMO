[project]
name = "where-to-dine"
version = "2.0.0"
description = "Uncertainty-aware NYC dining district intelligence"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"

[tool.coverage.run]
source = ["src", "app.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
